<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Reborn新生留学 · 高阶词汇听写</title>
    <style>
        /* ===== CSS Variables ===== */
        :root {
            --color-main-green: #2E5938;
            --color-aux-beige: #F2E9D2;
            --color-page-bg: #F8F7F0;
            --color-card-bg: #F5F4EB;
            --color-input-bg: #FFFFFF;
            --color-text-dark: #222222;
            --color-text-placeholder: #999999;
            --color-error: #b13e3e;
            --color-orange: #cc6b2c;
            --radius-card: 24px;
            --radius-btn: 16px;
            --radius-input: 12px;
            --radius-tag: 999px;
            --shadow-card: 0 2px 8px rgba(0,0,0,0.06);
            --shadow-btn: 0 1px 3px rgba(0,0,0,0.04);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', 'Noto Sans SC', sans-serif;
            background-color: var(--color-page-bg);
            color: var(--color-text-dark);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 24px 16px;
        }

        .app-container {
            max-width: 680px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 28px;
        }

        .toast {
            position: fixed;
            top: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(-80px);
            background: var(--color-main-green);
            color: #fff;
            padding: 12px 28px;
            border-radius: var(--radius-tag);
            font-size: 15px;
            font-weight: 500;
            box-shadow: 0 4px 20px rgba(0,0,0,0.18);
            opacity: 0;
            transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s ease;
            z-index: 999;
            pointer-events: none;
            letter-spacing: 0.5px;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        .brand-card {
            background: var(--color-card-bg);
            border-radius: var(--radius-card);
            box-shadow: var(--shadow-card);
            padding: 26px 20px 20px;
            text-align: center;
        }
        .brand-card h1 {
            font-size: 30px;
            font-weight: 700;
            color: var(--color-main-green);
            letter-spacing: 2px;
        }
        .brand-card .sub {
            font-size: 16px;
            font-weight: 300;
            color: var(--color-text-placeholder);
            letter-spacing: 4px;
            margin-top: 4px;
        }

        .mode-tabs {
            display: flex;
            gap: 8px;
            background: var(--color-card-bg);
            border-radius: var(--radius-card);
            padding: 8px;
            box-shadow: var(--shadow-card);
        }
        .mode-tab {
            flex: 1;
            padding: 12px 8px;
            border: none;
            border-radius: var(--radius-btn);
            background: transparent;
            font-size: 16px;
            font-weight: 500;
            color: var(--color-text-placeholder);
            cursor: pointer;
            transition: 0.2s;
            font-family: inherit;
            letter-spacing: 0.5px;
        }
        .mode-tab.active {
            background: #FFFFFF;
            color: var(--color-main-green);
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .mode-tab:hover:not(.active) { color: var(--color-text-dark); }

        .quiz-card {
            background: var(--color-card-bg);
            border-radius: var(--radius-card);
            box-shadow: var(--shadow-card);
            padding: 28px 24px 24px;
            transition: opacity 0.2s;
        }

        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px 8px;
            margin-bottom: 16px;
        }
        .progress-badge {
            background: var(--color-main-green);
            color: #fff;
            font-size: 14px;
            font-weight: 500;
            padding: 4px 16px;
            border-radius: var(--radius-tag);
            letter-spacing: 0.5px;
        }
        .timer-box {
            background: var(--color-aux-beige);
            border-radius: var(--radius-tag);
            padding: 6px 18px 6px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 500;
            font-size: 17px;
        }
        .timer-box .bar {
            width: 80px;
            height: 5px;
            background: rgba(46, 89, 56, 0.18);
            border-radius: 20px;
            overflow: hidden;
        }
        .timer-box .bar .fill {
            height: 100%;
            width: 100%;
            background: var(--color-main-green);
            border-radius: 20px;
            transition: width 0.3s linear;
        }

        /* 听写模式 */
        .sound-hint {
            background: var(--color-aux-beige);
            border-radius: var(--radius-input);
            padding: 16px 12px;
            text-align: center;
            color: var(--color-text-placeholder);
            font-weight: 400;
            letter-spacing: 1px;
            font-size: 16px;
            margin-bottom: 18px;
            border: 1px dashed #d6d0c0;
            cursor: pointer;
            transition: background 0.2s;
        }
        .sound-hint:hover { background: #ede6d6; }
        .sound-hint .icon { font-size: 28px; display: block; margin-bottom: 4px; }
        .sound-hint .hint-text.playing { color: var(--color-main-green); font-weight: 500; }

        .input-row {
            display: flex;
            gap: 12px;
            align-items: center;
            margin-bottom: 18px;
        }
        .input-row .input-wrap { flex: 1; min-width: 0; }
        .input-row .input-wrap input {
            width: 100%;
            padding: 15px 18px;
            background: var(--color-input-bg);
            border: 1.5px solid #ddd;
            border-radius: var(--radius-input);
            font-size: 18px;
            color: var(--color-text-dark);
            outline: none;
            transition: border 0.2s, box-shadow 0.2s;
            font-family: inherit;
        }
        .input-row .input-wrap input:focus {
            border-color: var(--color-main-green);
            box-shadow: 0 0 0 3px rgba(46, 89, 56, 0.12);
        }
        .input-row .input-wrap input::placeholder { color: var(--color-text-placeholder); font-weight: 300; }
        .input-row .input-wrap input:disabled { background: #f2f2f2; color: #888; }

        .btn-confirm {
            background: var(--color-main-green);
            color: #fff;
            border: none;
            padding: 15px 24px;
            border-radius: var(--radius-btn);
            font-weight: 600;
            font-size: 16px;
            box-shadow: var(--shadow-btn);
            cursor: pointer;
            transition: background 0.15s, transform 0.1s;
            font-family: inherit;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .btn-confirm:hover { background: #1f452b; }
        .btn-confirm:active { transform: scale(0.97); }
        .btn-confirm:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        /* 含义检查模式 */
        .meaning-sentence {
            background: #fff;
            border-radius: var(--radius-input);
            padding: 20px 18px;
            font-size: 19px;
            line-height: 1.7;
            margin-bottom: 18px;
            border: 1px solid #eee;
            min-height: 80px;
            box-shadow: var(--shadow-btn);
            letter-spacing: 0.3px;
        }
        .meaning-sentence .blank {
            display: inline-block;
            min-width: 80px;
            border-bottom: 3px solid var(--color-main-green);
            margin: 0 4px;
            color: var(--color-main-green);
            font-weight: 600;
        }
        .meaning-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 18px;
        }
        .meaning-options .opt-btn {
            padding: 14px 12px;
            border: 2px solid #ddd;
            border-radius: var(--radius-input);
            background: #fff;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
            font-family: inherit;
            text-align: center;
            color: var(--color-text-dark);
        }
        .meaning-options .opt-btn:hover:not(:disabled) { border-color: var(--color-main-green); }
        .meaning-options .opt-btn.selected { border-color: var(--color-main-green); background: #f0f7ea; }
        .meaning-options .opt-btn.correct { border-color: var(--color-main-green); background: #d4ebc5; }
        .meaning-options .opt-btn.wrong { border-color: var(--color-error); background: #fce4e4; }
        .meaning-options .opt-btn:disabled { cursor: not-allowed; opacity: 0.8; }

        .action-row {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            justify-content: space-between;
        }
        .action-row .left-group { display: flex; gap: 10px; flex-wrap: wrap; }

        .btn-outline {
            background: #fff;
            border: 1.5px solid var(--color-main-green);
            color: var(--color-main-green);
            padding: 8px 22px;
            border-radius: var(--radius-btn);
            font-weight: 500;
            font-size: 15px;
            box-shadow: var(--shadow-btn);
            cursor: pointer;
            transition: background 0.15s, transform 0.1s;
            font-family: inherit;
        }
        .btn-outline:hover { background: #f0f5ec; }
        .btn-outline:active { transform: scale(0.97); }
        .btn-outline:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        .btn-skip {
            background: #fff;
            border: 1.5px solid var(--color-orange);
            color: var(--color-orange);
            padding: 8px 22px;
            border-radius: var(--radius-btn);
            font-weight: 500;
            font-size: 15px;
            box-shadow: var(--shadow-btn);
            cursor: pointer;
            transition: background 0.15s, transform 0.1s;
            font-family: inherit;
        }
        .btn-skip:hover { background: #fdf0e8; }
        .btn-skip:active { transform: scale(0.97); }
        .btn-skip:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        .hint-key { font-size: 14px; color: var(--color-text-placeholder); }

        /* 结果页 */
        .result-card {
            background: var(--color-card-bg);
            border-radius: var(--radius-card);
            box-shadow: var(--shadow-card);
            padding: 28px 24px 24px;
            display: none;
        }
        .result-card.visible { display: block; animation: fadeUp 0.4s ease; }
        @keyframes fadeUp { 0% { opacity: 0; transform: translateY(16px); } 100% { opacity: 1; transform: translateY(0); } }

        .confetti-line { font-size: 34px; letter-spacing: 8px; text-align: center; padding: 4px 0 2px; }
        .result-title { text-align: center; font-size: 24px; font-weight: 600; margin: 6px 0 12px; }
        .result-title.green { color: var(--color-main-green); }
        .result-title.orange { color: var(--color-orange); }
        .result-title.red { color: var(--color-error); }

        .stats-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 16px 32px;
            background: #fff;
            padding: 16px 20px;
            border-radius: var(--radius-btn);
            box-shadow: var(--shadow-btn);
            margin-bottom: 18px;
        }
        .stats-grid .stat { display: flex; align-items: baseline; gap: 6px; }
        .stats-grid .stat .num { font-size: 26px; font-weight: 700; color: var(--color-main-green); }
        .stats-grid .stat .num.red { color: var(--color-error); }
        .stats-grid .stat .num.gray { color: #888; }
        .stats-grid .stat .label { color: var(--color-text-placeholder); font-size: 15px; }

        .error-list {
            background: #fff;
            border-radius: var(--radius-input);
            padding: 12px 16px;
            margin: 12px 0 18px;
            border-left: 4px solid var(--color-main-green);
            font-size: 15px;
            max-height: 200px;
            overflow-y: auto;
        }
        .error-list .row {
            display: flex;
            gap: 10px;
            padding: 5px 0;
            border-bottom: 1px solid #f0f0f0;
            flex-wrap: wrap;
            align-items: baseline;
        }
        .error-list .row:last-child { border-bottom: none; }
        .error-list .wrong { color: var(--color-error); }
        .error-list .empty { color: #999; }
        .error-list .bulb { font-size: 18px; margin-right: 4px; }
        .error-list .meaning-detail { font-size: 13px; color: #888; width: 100%; padding-left: 28px; }

        .result-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            margin-top: 6px;
        }
        .btn-outline-export {
            background: #fff;
            border: 1.5px solid var(--color-orange);
            color: var(--color-orange);
            padding: 8px 22px;
            border-radius: var(--radius-btn);
            font-weight: 500;
            font-size: 15px;
            box-shadow: var(--shadow-btn);
            cursor: pointer;
            transition: background 0.15s, transform 0.1s;
            font-family: inherit;
        }
        .btn-outline-export:hover { background: #fdf0e8; }
        .btn-outline-export:active { transform: scale(0.97); }

        .btn-retry {
            background: #fff;
            border: 1.5px solid var(--color-main-green);
            color: var(--color-main-green);
            padding: 8px 22px;
            border-radius: var(--radius-btn);
            font-weight: 500;
            font-size: 15px;
            box-shadow: var(--shadow-btn);
            cursor: pointer;
            transition: background 0.15s, transform 0.1s;
            font-family: inherit;
        }
        .btn-retry:hover { background: #f0f5ec; }
        .btn-retry:active { transform: scale(0.97); }

        .btn-home {
            background: var(--color-aux-beige);
            border: 1.5px solid var(--color-main-green);
            color: var(--color-main-green);
            padding: 8px 22px;
            border-radius: var(--radius-btn);
            font-weight: 500;
            font-size: 15px;
            box-shadow: var(--shadow-btn);
            cursor: pointer;
            transition: background 0.15s, transform 0.1s;
            font-family: inherit;
        }
        .btn-home:hover { background: #e6dbc4; }
        .btn-home:active { transform: scale(0.97); }

        .loading-text { text-align: center; padding: 40px 20px; color: var(--color-text-placeholder); font-size: 16px; }

        @media (max-width: 500px) {
            .brand-card h1 { font-size: 24px; }
            .quiz-card { padding: 20px 16px; }
            .timer-box .bar { width: 50px; }
            .meaning-options { grid-template-columns: 1fr 1fr; }
            .meaning-options .opt-btn { font-size: 14px; padding: 12px 8px; }
            .meaning-sentence { font-size: 17px; padding: 16px 14px; }
            .input-row { flex-wrap: wrap; }
            .btn-confirm { width: 100%; justify-content: center; padding: 12px; }
            .action-row { flex-direction: column; align-items: stretch; }
            .action-row .left-group { justify-content: center; }
            .result-actions { flex-direction: column; align-items: stretch; }
            .result-actions button { width: 100%; justify-content: center; }
            .stats-grid { gap: 10px 20px; }
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="toast" id="toast"></div>

    <div class="brand-card">
        <h1>Reborn新生留学</h1>
        <div class="sub">高阶词汇听写</div>
    </div>

    <!-- 模式切换 -->
    <div class="mode-tabs">
        <button class="mode-tab active" data-mode="dictation">🔊 听写检查</button>
        <button class="mode-tab" data-mode="meaning">📝 含义检查</button>
    </div>

    <div class="quiz-card" id="quizCard">
        <div class="quiz-header">
            <span class="progress-badge" id="progressBadge">1 / 25</span>
            <div class="timer-box">
                <span>⏱</span>
                <span class="bar"><span class="fill" id="timerFill" style="width:100%"></span></span>
                <span id="timerText">15s</span>
            </div>
        </div>

        <!-- 听写模式 -->
        <div id="dictationArea">
            <div class="sound-hint" id="soundHint">
                <span class="icon">🔊</span>
                <span class="hint-text" id="hintText">准备开始...</span>
            </div>
            <div class="input-row">
                <div class="input-wrap">
                    <input type="text" id="answerInput" placeholder="请输入单词..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" inputmode="latin">
                </div>
                <button class="btn-confirm" id="confirmBtn">确认</button>
            </div>
        </div>

        <!-- 含义检查模式（默认隐藏） -->
        <div id="meaningArea" style="display:none;">
            <div class="meaning-sentence" id="meaningSentence"></div>
            <div class="meaning-options" id="meaningOptions"></div>
        </div>

        <div class="action-row">
            <div class="left-group">
                <button class="btn-outline" id="replayBtn">🔊 再放一次</button>
                <button class="btn-skip" id="skipBtn">⏭ 不知道</button>
            </div>
            <span class="hint-key" id="enterHint">按 Enter 提交</span>
        </div>
    </div>

    <div class="result-card" id="resultCard">
        <div class="confetti-line">✨ 🎉 ✨ 🎊 ✨ 🌸 ✨</div>
        <div class="result-title" id="resultTitle">✅ 练习完成！</div>
        <div class="stats-grid" id="statsGrid"></div>
        <div style="font-weight:500; margin-bottom:6px;">📋 需要复习的词汇</div>
        <div class="error-list" id="errorList"></div>
        <div class="result-actions">
            <button class="btn-outline-export" id="exportBtn">📤 导出错词 (TXT)</button>
            <button class="btn-retry" id="retryBtn">🔄 再来一次</button>
            <button class="btn-home" id="homeBtn">🏠 回到首页</button>
        </div>
    </div>
</div>

<script>
    // ============================================================
    // 获取 URL 参数
    // ============================================================
    function getUrlParams() {
        var params = new URLSearchParams(window.location.search);
        var mode = params.get('mode') || 'dictation';
        var unitsParam = params.get('units') || '';
        var accent = params.get('voice') || 'en-GB';
        return { mode: mode, units: unitsParam.split(',').filter(Boolean), accent: accent };
    }

    var urlParams = getUrlParams();
    var currentMode = urlParams.mode;
    var selectedUnits = urlParams.units;
    var accent = urlParams.accent;

    // 如果没有传递任何单元，显示提示
    if (selectedUnits.length === 0) {
        document.querySelector('.quiz-card').innerHTML = `
            <div class="loading-text">
                <p style="font-size:20px; margin-bottom:12px;">⚠️ 未选择任何单元</p>
                <p style="font-size:14px; color:var(--color-text-placeholder);">请从首页选择单元后重新进入</p>
                <button class="btn-home" style="margin-top:20px; padding:10px 32px;" onclick="location.href='index.html'">🏠 回到首页</button>
            </div>
        `;
        throw new Error('未选择单元');
    }

    // 检查 VOCABULARY_DATA 是否已加载
    if (typeof VOCABULARY_DATA === 'undefined') {
        document.querySelector('.quiz-card').innerHTML = `
            <div class="loading-text">
                <p style="font-size:20px; margin-bottom:12px;">⚠️ 词汇数据加载失败</p>
                <p style="font-size:14px; color:var(--color-text-placeholder);">请确认 vocabulary.js 已正确加载</p>
                <button class="btn-home" style="margin-top:20px; padding:10px 32px;" onclick="location.href='index.html'">🏠 回到首页</button>
            </div>
        `;
        throw new Error('VOCABULARY_DATA 未定义');
    }

    // 模式切换
    document.querySelectorAll('.mode-tab').forEach(function(tab) {
        tab.addEventListener('click', function() {
            // 不允许在练习中途切换模式
            if (isQuizActive) {
                showToast('⚠️ 练习进行中，请先完成或退出', 1500);
                return;
            }
            document.querySelectorAll('.mode-tab').forEach(function(t) { t.classList.remove('active'); });
            this.classList.add('active');
            var mode = this.dataset.mode;
            currentMode = mode;
            if (mode === 'dictation') {
                document.getElementById('dictationArea').style.display = 'block';
                document.getElementById('meaningArea').style.display = 'none';
                document.getElementById('replayBtn').style.display = 'inline-block';
                document.getElementById('skipBtn').style.display = 'inline-block';
            } else {
                document.getElementById('dictationArea').style.display = 'none';
                document.getElementById('meaningArea').style.display = 'block';
                document.getElementById('replayBtn').style.display = 'none';
                document.getElementById('skipBtn').style.display = 'inline-block';
            }
            // 重置练习
            resetQuiz();
        });
    });

    // ============================================================
    // 加载词汇数据
    // ============================================================
    function loadWordsFromUnits(unitIds) {
        var allWords = [];
        unitIds.forEach(function(id) {
            var unit = window.VOCABULARY_DATA && window.VOCABULARY_DATA[id];
            if (unit && unit.words) {
                allWords = allWords.concat(unit.words);
            }
        });
        return allWords;
    }

    var rawWords = loadWordsFromUnits(selectedUnits);

    if (rawWords.length === 0) {
        document.querySelector('.quiz-card').innerHTML = `
            <div class="loading-text">
                <p style="font-size:20px; margin-bottom:12px;">⚠️ 所选单元暂无词汇数据</p>
                <p style="font-size:14px; color:var(--color-text-placeholder);">请确认 vocabulary.js 中包含这些单元的数据</p>
                <button class="btn-home" style="margin-top:20px; padding:10px 32px;" onclick="location.href='index.html'">🏠 回到首页</button>
            </div>
        `;
        throw new Error('所选单元无词汇数据');
    }

    // ============================================================
    // 状态
    // ============================================================
    var quizWords = [];
    var currentIndex = 0;
    var results = [];
    var timer = null;
    var timeLeft = 15;
    var isAnswered = false;
    var isQuizActive = false;
    var toastTimer = null;

    // DOM
    var toast = document.getElementById('toast');
    var quizCard = document.getElementById('quizCard');
    var resultCard = document.getElementById('resultCard');
    var progressBadge = document.getElementById('progressBadge');
    var timerFill = document.getElementById('timerFill');
    var timerText = document.getElementById('timerText');
    var hintText = document.getElementById('hintText');
    var answerInput = document.getElementById('answerInput');
    var replayBtn = document.getElementById('replayBtn');
    var skipBtn = document.getElementById('skipBtn');
    var confirmBtn = document.getElementById('confirmBtn');
    var enterHint = document.getElementById('enterHint');
    var statsGrid = document.getElementById('statsGrid');
    var errorList = document.getElementById('errorList');
    var retryBtn = document.getElementById('retryBtn');
    var homeBtn = document.getElementById('homeBtn');
    var exportBtn = document.getElementById('exportBtn');
    var resultTitle = document.getElementById('resultTitle');
    var soundHint = document.getElementById('soundHint');
    var meaningSentence = document.getElementById('meaningSentence');
    var meaningOptions = document.getElementById('meaningOptions');

    function showToast(msg, duration) {
        duration = duration || 2000;
        if (toastTimer) { clearTimeout(toastTimer); toast.classList.remove('show'); }
        toast.textContent = msg;
        toast.classList.add('show');
        toastTimer = setTimeout(function() { toast.classList.remove('show'); toastTimer = null; }, duration);
    }

    // 禁用中文输入法
    function disableChineseIME(e) {
        var el = e.target;
        el.blur();
        setTimeout(function() { el.focus(); }, 10);
    }

    answerInput.addEventListener('compositionstart', function(e) {
        if (isAnswered) return;
        var val = this.value;
        if (/[^a-zA-Z\s\-'\.]/.test(val)) { this.value = val.replace(/[^a-zA-Z\s\-'\.]/g, ''); }
        disableChineseIME(e);
    });

    answerInput.addEventListener('input', function(e) {
        if (isAnswered) return;
        var val = this.value;
        if (/[^a-zA-Z\s\-'\.]/.test(val)) {
            this.value = val.replace(/[^a-zA-Z\s\-'\.]/g, '');
            showToast('⚠️ 仅支持英文输入', 1000);
        }
    });

    // ============================================================
    // 发音
    // ============================================================
    function playSound(word) {
        hintText.textContent = '🔊 播放中 ...';
        hintText.className = 'hint-text playing';
        soundHint.style.borderColor = 'var(--color-main-green)';

        if ('speechSynthesis' in window) {
            speechSynthesis.cancel();
            var utter = new SpeechSynthesisUtterance(word);
            utter.lang = accent === 'us' ? 'en-US' : 'en-GB';
            utter.rate = 0.9;
            var voices = speechSynthesis.getVoices();
            var preferred = voices.find(function(v) { return v.lang.startsWith(accent === 'us' ? 'en-US' : 'en-GB'); });
            if (preferred) utter.voice = preferred;
            speechSynthesis.speak(utter);
            utter.onend = function() {
                hintText.textContent = '点击「再放一次」再听一次';
                hintText.className = 'hint-text';
                soundHint.style.borderColor = '#d6d0c0';
            };
        } else {
            setTimeout(function() {
                hintText.textContent = '点击「再放一次」再听一次';
                hintText.className = 'hint-text';
                soundHint.style.borderColor = '#d6d0c0';
            }, 1200);
        }
    }

    // ============================================================
    // 核心逻辑
    // ============================================================
    function shuffleArray(arr) {
        for (var i = arr.length - 1; i > 0; i--) {
            var j = Math.floor(Math.random() * (i + 1));
            var temp = arr[i];
            arr[i] = arr[j];
            arr[j] = temp;
        }
        return arr;
    }

    function initQuiz() {
        // 打乱并取25个
        var shuffled = shuffleArray(rawWords.slice());
        quizWords = shuffled.slice(0, 25);
        if (quizWords.length === 0) {
            showToast('⚠️ 没有足够词汇，请选择更多单元', 2000);
            return;
        }
        currentIndex = 0;
        results = [];
        isQuizActive = true;
        quizCard.style.display = 'block';
        resultCard.classList.remove('visible');
        resultCard.style.display = 'none';
        answerInput.disabled = false;
        answerInput.value = '';
        answerInput.focus();
        isAnswered = false;
        clearTimer();
        renderQuestion();
    }

    function resetQuiz() {
        clearTimer();
        isQuizActive = false;
        quizWords = [];
        currentIndex = 0;
        results = [];
        quizCard.style.display = 'block';
        resultCard.classList.remove('visible');
        resultCard.style.display = 'none';
        answerInput.disabled = false;
        answerInput.value = '';
        isAnswered = false;
        enterHint.textContent = '按 Enter 提交';
        if (currentMode === 'dictation') {
            hintText.textContent = '准备开始...';
            hintText.className = 'hint-text';
            document.getElementById('dictationArea').style.display = 'block';
            document.getElementById('meaningArea').style.display = 'none';
            document.getElementById('replayBtn').style.display = 'inline-block';
        } else {
            document.getElementById('dictationArea').style.display = 'none';
            document.getElementById('meaningArea').style.display = 'block';
            document.getElementById('replayBtn').style.display = 'none';
        }
        document.getElementById('skipBtn').style.display = 'inline-block';
        progressBadge.textContent = '0 / 0';
        timerText.textContent = '0s';
        timerFill.style.width = '0%';
        // 重新开始
        initQuiz();
    }

    function renderQuestion() {
        if (currentIndex >= quizWords.length) {
            showResult();
            return;
        }

        var total = quizWords.length;
        progressBadge.textContent = (currentIndex + 1) + ' / ' + total;
        answerInput.value = '';
        answerInput.disabled = false;
        setTimeout(function() { answerInput.focus(); }, 50);
        isAnswered = false;
        confirmBtn.disabled = false;

        var wordObj = quizWords[currentIndex];
        var word = wordObj.word || wordObj;

        if (currentMode === 'dictation') {
            // 听写模式
            document.getElementById('dictationArea').style.display = 'block';
            document.getElementById('meaningArea').style.display = 'none';
            document.getElementById('replayBtn').style.display = 'inline-block';
            hintText.textContent = '点击「再放一次」听发音';
            hintText.className = 'hint-text';
            soundHint.style.borderColor = '#d6d0c0';
            answerInput.placeholder = '请输入单词...';
            answerInput.value = '';
            timeLeft = 15;
            timerFill.style.width = '100%';
            timerText.textContent = '15s';
            clearTimer();
            startTimer();
            setTimeout(function() { playSound(word); }, 300);
            enterHint.textContent = '按 Enter 或点击「确认」提交';
        } else {
            // 含义检查模式
            document.getElementById('dictationArea').style.display = 'none';
            document.getElementById('meaningArea').style.display = 'block';
            document.getElementById('replayBtn').style.display = 'none';
            answerInput.placeholder = '请选择答案...';
            answerInput.disabled = true;
            timeLeft = 10;
            timerFill.style.width = '100%';
            timerText.textContent = '10s';
            clearTimer();
            startTimer();
            renderMeaningQuestion(wordObj);
            enterHint.textContent = '点击选项后自动提交 或 点击「不知道」';
        }

        document.getElementById('skipBtn').style.display = 'inline-block';
        document.getElementById('skipBtn').disabled = false;
    }

    // ============================================================
    // 含义检查渲染
    // ============================================================
    function renderMeaningQuestion(wordObj) {
        var correctWord = wordObj.word || wordObj;
        var example = wordObj.example || '';
        var sentence = example.replace(correctWord, '______');

        meaningSentence.innerHTML = sentence;

        // 生成选项：1个正确 + 3个干扰（从同一Day的词汇中选）
        var currentDayWords = quizWords.filter(function(w) {
            return (w.word || w) !== correctWord;
        });

        var shuffledDistractors = shuffleArray(currentDayWords.slice());
        var distractors = shuffledDistractors.slice(0, 3).map(function(w) { return w.word || w; });
        while (distractors.length < 3) {
            distractors.push('______');
        }

        var options = shuffleArray([correctWord].concat(distractors));
        var optionLabels = ['A', 'B', 'C', 'D'];

        meaningOptions.innerHTML = '';
        options.forEach(function(opt, idx) {
            var btn = document.createElement('button');
            btn.className = 'opt-btn';
            btn.textContent = optionLabels[idx] + '. ' + opt;
            btn.dataset.value = opt;
            btn.addEventListener('click', function() {
                if (isAnswered) return;
                handleMeaningAnswer(opt, correctWord);
            });
            meaningOptions.appendChild(btn);
        });
    }

    function handleMeaningAnswer(selected, correct) {
        if (isAnswered) return;
        isAnswered = true;
        clearTimer();

        var isCorrect = selected === correct;
        var wordObj = quizWords[currentIndex];
        var word = wordObj.word || wordObj;
        results.push({ word: word, userAnswer: selected, status: isCorrect ? 'correct' : 'wrong', correctAnswer: correct });

        // 显示选项结果
        var btns = meaningOptions.querySelectorAll('.opt-btn');
        btns.forEach(function(btn) {
            btn.disabled = true;
            if (btn.dataset.value === correct) btn.classList.add('correct');
            if (btn.dataset.value === selected && !isCorrect) btn.classList.add('wrong');
            if (btn.dataset.value === selected) btn.classList.add('selected');
        });

        enterHint.textContent = isCorrect ? '✅ 正确！' : '❌ 正确答案: ' + correct;

        setTimeout(function() {
            currentIndex++;
            renderQuestion();
        }, 700);
    }

    // ============================================================
    // 计时器
    // ============================================================
    function startTimer() {
        clearTimer();
        var maxTime = currentMode === 'dictation' ? 15 : 10;
        timer = setInterval(function() {
            timeLeft -= 0.2;
            if (timeLeft <= 0) {
                timeLeft = 0;
                timerFill.style.width = '0%';
                timerText.textContent = '0s';
                clearTimer();
                if (!isAnswered && currentIndex < quizWords.length) handleTimeout();
                return;
            }
            var pct = (timeLeft / maxTime) * 100;
            timerFill.style.width = pct + '%';
            timerText.textContent = Math.ceil(timeLeft) + 's';
        }, 200);
    }

    function clearTimer() {
        if (timer) { clearInterval(timer); timer = null; }
    }

    function handleTimeout() {
        if (isAnswered) return;
        var wordObj = quizWords[currentIndex];
        var word = wordObj.word || wordObj;
        if (currentMode === 'dictation') {
            results.push({ word: word, userAnswer: '(超时未填)', status: 'skipped' });
            enterHint.textContent = '⏱ 超时，自动跳过';
        } else {
            results.push({ word: word, userAnswer: '(超时未选)', status: 'skipped', correctAnswer: word });
            var btns = meaningOptions.querySelectorAll('.opt-btn');
            btns.forEach(function(btn) { btn.disabled = true; if (btn.dataset.value === word) btn.classList.add('correct'); });
            enterHint.textContent = '⏱ 超时，正确答案: ' + word;
        }
        isAnswered = true;
        answerInput.disabled = true;
        confirmBtn.disabled = true;
        document.getElementById('skipBtn').disabled = true;

        setTimeout(function() {
            currentIndex++;
            renderQuestion();
        }, 700);
    }

    // ============================================================
    // 提交（听写模式）
    // ============================================================
    function submitAnswer() {
        if (isAnswered || currentMode === 'meaning') return;
        var input = answerInput.value.trim();
        var wordObj = quizWords[currentIndex];
        var word = wordObj.word || wordObj;

        if (input === '') {
            results.push({ word: word, userAnswer: '(未填)', status: 'skipped' });
            isAnswered = true;
            answerInput.disabled = true;
            confirmBtn.disabled = true;
            enterHint.textContent = '⏭ 未填，已跳过';
            clearTimer();
            setTimeout(function() { currentIndex++; renderQuestion(); }, 500);
            return;
        }

        var correct = word.toLowerCase().trim();
        var user = input.toLowerCase().trim();
        var status = user === correct ? 'correct' : 'wrong';
        results.push({ word: word, userAnswer: input, status: status });
        isAnswered = true;
        answerInput.disabled = true;
        confirmBtn.disabled = true;
        clearTimer();

        if (status === 'correct') enterHint.textContent = '✅ 正确！';
        else enterHint.textContent = '❌ 正确: ' + correct;

        setTimeout(function() { currentIndex++; renderQuestion(); }, 700);
    }

    function handleSkip() {
        if (isAnswered) return;
        var wordObj = quizWords[currentIndex];
        var word = wordObj.word || wordObj;
        if (currentMode === 'dictation') {
            results.push({ word: word, userAnswer: '(跳过)', status: 'skipped' });
            enterHint.textContent = '⏭ 已跳过';
        } else {
            results.push({ word: word, userAnswer: '(跳过)', status: 'skipped', correctAnswer: word });
            var btns = meaningOptions.querySelectorAll('.opt-btn');
            btns.forEach(function(btn) { btn.disabled = true; if (btn.dataset.value === word) btn.classList.add('correct'); });
            enterHint.textContent = '⏭ 已跳过，正确答案: ' + word;
        }
        isAnswered = true;
        answerInput.disabled = true;
        confirmBtn.disabled = true;
        document.getElementById('skipBtn').disabled = true;
        clearTimer();

        setTimeout(function() { currentIndex++; renderQuestion(); }, 500);
    }

    function handleReplay() {
        if (isAnswered || currentMode === 'meaning') return;
        var wordObj = quizWords[currentIndex];
        var word = wordObj.word || wordObj;
        playSound(word);
    }

    // ============================================================
    // 结果页
    // ============================================================
    function showResult() {
        clearTimer();
        isQuizActive = false;
        if ('speechSynthesis' in window) speechSynthesis.cancel();

        quizCard.style.display = 'none';
        resultCard.style.display = 'block';
        requestAnimationFrame(function() { resultCard.classList.add('visible'); });

        var correct = 0, wrong = 0, skipped = 0;
        results.forEach(function(r) {
            if (r.status === 'correct') correct++;
            else if (r.status === 'wrong') wrong++;
            else skipped++;
        });
        var total = results.length;
        var rate = total > 0 ? (correct / total * 100) : 0;

        var titleText = '', titleClass = '';
        if (rate >= 80) { titleText = '💡 完美通关！继续加油！'; titleClass = 'green'; }
        else if (rate >= 70) { titleText = '💡 哎呀，差一丢丢过关哦~'; titleClass = 'orange'; }
        else { titleText = '💡 错误有点多哦，再复习一下~'; titleClass = 'red'; }
        resultTitle.textContent = titleText;
        resultTitle.className = 'result-title ' + titleClass;

        var modeLabel = currentMode === 'dictation' ? '听写' : '含义检查';
        statsGrid.innerHTML =
            '<div class="stat"><span class="num">' + correct + '</span><span class="label">正确</span></div>' +
            '<div class="stat"><span class="num red">' + wrong + '</span><span class="label">错误</span></div>' +
            '<div class="stat"><span class="num gray">' + skipped + '</span><span class="label">跳过</span></div>' +
            '<div class="stat"><span class="num" style="font-size:22px;">' + rate.toFixed(2) + '%</span><span class="label">正确率</span></div>';

        var errors = results.filter(function(r) { return r.status === 'wrong' || r.status === 'skipped'; });
        if (errors.length === 0) {
            errorList.innerHTML = '<div style="padding:6px 0; color:var(--color-main-green);">🎉 全部正确，太棒了！</div>';
        } else {
            var html = '';
            errors.forEach(function(r) {
                var icon = r.status === 'wrong' ? '❌' : '⬜';
                var cls = r.status === 'wrong' ? 'wrong' : 'empty';
                var displayAnswer = r.userAnswer || '(未填)';
                var detail = '';
                if (currentMode === 'meaning' && r.correctAnswer) {
                    detail = ' 正确选项: ' + r.correctAnswer;
                }
                html += '<div class="row"><span class="' + cls + '"><span class="bulb">' + icon + '</span> ' + r.word + '</span> → <span>' + displayAnswer + detail + '</span></div>';
            });
            errorList.innerHTML = html;
        }
    }

    // ============================================================
    // 导出错词
    // ============================================================
    function exportErrors() {
        var errors = results.filter(function(r) { return r.status === 'wrong' || r.status === 'skipped'; });
        if (errors.length === 0) { showToast('🎉 没有错词需要导出！', 2000); return; }
        var lines = [];
        var modeLabel = currentMode === 'dictation' ? '听写' : '含义检查';
        lines.push('📘 Reborn新生留学 · 高阶词汇' + modeLabel + ' 错词导出');
        lines.push('导出时间: ' + new Date().toLocaleString());
        lines.push('─'.repeat(40));
        errors.forEach(function(r, idx) {
            var statusText = r.status === 'wrong' ? '❌ 错误' : '⬜ 跳过';
            var detail = '';
            if (currentMode === 'meaning' && r.correctAnswer) {
                detail = '  [正确答案: ' + r.correctAnswer + ']';
            }
            lines.push((idx + 1) + '. ' + r.word + '  →  你的答案: ' + (r.userAnswer || '(未填)') + '  ' + statusText + detail);
        });
        lines.push('─'.repeat(40));
        lines.push('📝 共 ' + errors.length + ' 个需要复习的词汇');

        var content = lines.join('\n');
        var blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = '错词列表_' + new Date().toISOString().slice(0, 10) + '.txt';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showToast('✅ 错词已导出！', 2000);
    }

    // ============================================================
    // 事件绑定
    // ============================================================
    answerInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            if (currentMode === 'dictation' && !isAnswered && currentIndex < quizWords.length) submitAnswer();
        }
    });
    confirmBtn.addEventListener('click', function() {
        if (currentMode === 'dictation' && !isAnswered && currentIndex < quizWords.length) submitAnswer();
    });
    replayBtn.addEventListener('click', handleReplay);
    skipBtn.addEventListener('click', handleSkip);
    soundHint.addEventListener('click', function() {
        if (currentMode === 'dictation' && !isAnswered) handleReplay();
    });
    retryBtn.addEventListener('click', resetQuiz);
    homeBtn.addEventListener('click', function() {
        if (confirm('回到首页，当前进度将丢失。')) window.location.href = 'index.html';
    });
    exportBtn.addEventListener('click', exportErrors);

    // 初始化语音
    if ('speechSynthesis' in window) {
        speechSynthesis.getVoices();
        speechSynthesis.onvoiceschanged = function() { speechSynthesis.getVoices(); };
    }

    // 启动
    initQuiz();
    console.log('✅ Reborn新生留学 · 高阶词汇练习已启动');
    console.log('📋 模式: ' + (currentMode === 'dictation' ? '听写' : '含义检查'));
    console.log('🔊 发音: ' + (accent === 'us' ? '美音' : '英音'));
    console.log('📚 共 ' + quizWords.length + ' 个词汇');
</script>
